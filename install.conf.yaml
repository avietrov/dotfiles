- clean: ["~"]

- create:
    - ~/.config
    - ~/.config/zed

- link:
    ~/.config/Brewfile: Brewfile
    ~/.config/zsh/.zshenv: zsh/zshenv
    ~/.config/zsh/.zshrc: zsh/zshrc
    ~/.config/zsh/aliases.zsh: zsh/aliases.zsh
    ~/.config/sheldon: sheldon
    ~/.config/ghostty: ghostty
    ~/.config/nvim: nvim
    ~/.config/aerospace: aerospace
    # only syncing the confg and keymap for zed
    # the config folder contains a lot more
    ~/.config/zed/keymap.json: zed/keymap.json
    ~/.config/zed/settings.json: zed/settings.json
    ~/.gitignore_global: gitignore_global
    ~/.hushlogin: hushlogin
    # this file is git ignored
    # linking empty file for easy initial setup
    ~/.custom.zsh: custom.zsh

- shell:
    - [git submodule update --init --recursive, Installing submodules]
